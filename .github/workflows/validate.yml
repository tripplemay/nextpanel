name: Validation

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PG_BIN: /usr/lib/postgresql/16/bin
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/fixture
      API_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum
      - name: Install locked application dependencies and isolated test tools
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y postgresql-16 nftables iproute2 strace
          python -m pip install -r scripts/tests/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Install checksum-pinned sing-box for native config validation
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/sing-box-1.14.4-linux-amd64.tar.gz"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz \
            --output "$ARCHIVE"
          printf '%s  %s\n' 699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968 "$ARCHIVE" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-1.14.4-linux-amd64" >> "$GITHUB_PATH"
      - name: Install checksum-pinned Xray for loopback identity validation
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/Xray-linux-64.zip"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip \
            --output "$ARCHIVE"
          printf '%s  %s\n' e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214 "$ARCHIVE" | sha256sum --check -
          unzip -q "$ARCHIVE" xray -d "$RUNNER_TEMP/xray-fixture"
          chmod +x "$RUNNER_TEMP/xray-fixture/xray"
          echo "XRAY_BINARY=$RUNNER_TEMP/xray-fixture/xray" >> "$GITHUB_ENV"
          echo "GO_BINARY=$(command -v go)" >> "$GITHUB_ENV"
      - name: Install checksum-pinned Mihomo for CDN transport compatibility
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/mihomo-linux-amd64-v1.19.29.gz"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-v1.19.29.gz \
            --output "$ARCHIVE"
          printf '%s  %s\n' 60de76a35a6cbf7b4fa4a20f5c257c24345d1d635ab1aa3877022a1997ef413c "$ARCHIVE" | sha256sum --check -
          gzip -dc "$ARCHIVE" > "$RUNNER_TEMP/mihomo-fixture"
          chmod +x "$RUNNER_TEMP/mihomo-fixture"
          echo "MIHOMO_BINARY=$RUNNER_TEMP/mihomo-fixture" >> "$GITHUB_ENV"
      - name: Test, build, restore and browser gates
        run: |
          set -euo pipefail
          mkdir -p out/ci
          bash scripts/ci/verify.sh 2>&1 | tee out/ci/verification.log
      - name: Verify CF-only origin firewall in isolated Linux namespaces
        run: |
          set -euo pipefail
          sudo "$(command -v node)" scripts/tests/cf-origin-firewall.fixture.cjs 2>&1 | tee out/ci/cf-origin-firewall.log
      - name: Verify isolated Xray install without replacing the shared core
        run: |
          set -euo pipefail
          sudo "$(command -v node)" scripts/tests/cf-xhttp-core.fixture.cjs 2>&1 | tee out/ci/cf-xhttp-core.log
      - name: Verify reviewed Xray does not create MPTCP listeners by default
        run: |
          set -euo pipefail
          sudo python3 scripts/tests/xray-mptcp.fixture.py "$XRAY_BINARY" 2>&1 | tee out/ci/xray-mptcp.log
      - name: Preserve fixture-only verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.sha }}
          path: out/ci/
          retention-days: 7
          if-no-files-found: ignore
