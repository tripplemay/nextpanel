name: Deploy — 项目自动部署

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', '.gitignore', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: nextpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned SSH identity
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Stage, build, snapshot, migrate and verify
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST")
          CANDIDATE="/opt/apps/nextpanel-candidate-$GITHUB_SHA"
          "${SSH[@]}" "test ! -e '$CANDIDATE' && mkdir -m 700 '$CANDIDATE'"
          tar czf - --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='dist' --exclude='*.tsbuildinfo' . |
            "${SSH[@]}" "tar xzf - -C '$CANDIDATE'"
          "${SSH[@]}" "bash '$CANDIDATE/scripts/deploy-release.sh' deploy '$GITHUB_SHA'"
